      all data separately. Control charts default to the last 100 flights.
    definition_of_done: >
      python data/simulate.py runs; python -m pytest tests -q passes (every
      planned replacement is warned on the same flight, no part in service is
      past the shop's replace-at age, the tool still signals on exactly the
      flights the technician acted on, the timeline has only R/F/S); a
      scripted Shiny session renders every output with no error and no
      "Replace now" part.
    result: "Replace at the warning: 97 planned replacements each warned on the flight it was replaced after (84 at the replace-at age, 13 found worn by a chart), 2 in-flight failures, 17 special causes; timeline shows only R/F/S; 171 false alarms logged as no_fault and kept off the timeline; dashboard schedules with replace_at.csv so no part is overdue (refit shown beside it). pytest 82 passed; scripted Shiny session renders all 13 outputs, no error, no Replace-now part."

