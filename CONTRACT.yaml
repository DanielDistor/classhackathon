    notes: >
      Agreed with Div on 2026-10-16 after reviewing the H-04 app. A warning
      means replace before the next flight: the age warning fires at B10 and
      a chart-found worn part is replaced at once (no 10-flight lead, no 1-3
      flight wait). The timeline shows only R (warned and replaced, one
